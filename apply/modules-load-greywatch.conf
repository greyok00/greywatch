# greywatch app-firewall engine: kernel modules for the nftables NFQUEUE.
#
# The appfw ruleset queues new outgoing TCP connections to NFQUEUE 111.
# The 'queue' nft statement needs these two modules; they ship on disk
# but nothing on a default install loads them, so the engine's
# "nft -f" fails and the app firewall can never arm. The engine also
# modprobes them at arm time (defence in depth); this file makes the
# load permanent across boots so a reboot never strands the engine.
#
# nfnetlink_queue — the netfilter packet-queue handler (the queue itself)
# nft_queue      — the nftables 'queue' expression that targets it
nfnetlink_queue
nft_queue
