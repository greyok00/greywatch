# Same two gates CI runs, applied locally before every commit.
#   pip install -r requirements-dev.txt && pip install pre-commit
#   pre-commit run --all-files
# revs are release tags deliberately (pre-commit autoupdate manages them);
# the GitHub Actions themselves are pinned by commit SHA instead.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff