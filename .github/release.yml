# Auto-generated release notes: category labels GitHub applies when the
# release.yml workflow runs `gh release create --generate-notes`.
changelog:
  exclude:
    labels: [duplicate, question, invalid, wontfix, skip-notes]
  categories:
    - title: Breaking changes
      labels: [breaking, breaking-change]
    - title: Security
      labels: [security, hardening]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation, docs]
    - title: Build and CI
      labels: [ci, build, dependencies]