# Tag build (v*): run the battery, build the wheel, bundle the source tree
# with a checksum, attest build provenance, and publish the Release with
# the bundle, .deb, and wheel.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04   # ABI law: the runner OS names the cpython the .so are built for
    env:
      ARTIFACT: greywatch-${{ github.ref_name }}-linux-x86_64.tar.gz
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: GTK stack plus host tools the battery asserts (matches ci)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 yara

      - name: Toolchain (dev pins for the smoke battery)
        run: |
          # system-site-packages so the apt-installed PyGObject is importable
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --disable-pip-version-check \
            -r requirements-dev.txt

      # NO CYTHON (owner law 2026-11-10): the tree ships open readable Python;
      # the battery runs against plain .py sources and no .so is compiled.

      - name: Battery against the sources
        run: |
          source .venv/bin/activate
          python3 -m pytest tests/ -q

      - name: Build the Python package (wheel)
        run: |
          source .venv/bin/activate
          ./packaging/build-wheel.sh dist
          WHEEL="$(ls dist/greywatch-*.whl | head -1)"
          sha256sum "$WHEEL" > "${WHEEL}.sha256"
          echo "WHEEL=$(basename "$WHEEL")" >> "$GITHUB_ENV"

      - name: Bundle the source tree, add checksum
        run: |
          mkdir -p dist
          tar czf "dist/${ARTIFACT}" \
            --exclude-vcs --exclude='dist' --exclude='.venv' \
            --exclude='build' --exclude='__pycache__' \
            --exclude='.pytest_cache' --exclude='tmp*' \
            --exclude='data' \
            .
          sha256sum "dist/${ARTIFACT}" > "dist/${ARTIFACT}.sha256"

      - name: Build the Debian package (.deb) from the compiled tree
        run: |
          ./packaging/build-deb.sh dist
          DEB="$(ls dist/greywatch_*.deb)"
          echo "DEB=$(basename "$DEB")" >> "$GITHUB_ENV"

      - name: Provenance attestation for the bundles
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.DEB }}
            dist/${{ env.WHEEL }}

      # note categories come from .github/release.yml
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "dist/${ARTIFACT}" "dist/${ARTIFACT}.sha256" \
              "dist/${DEB}" "dist/${DEB}.sha256" \
              "dist/${WHEEL}" "dist/${WHEEL}.sha256" --clobber
            gh release edit "${{ github.ref_name }}" \
              --title "greywatch ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" \
              "dist/${ARTIFACT}" "dist/${ARTIFACT}.sha256" \
              "dist/${DEB}" "dist/${DEB}.sha256" \
              "dist/${WHEEL}" "dist/${WHEEL}.sha256" \
              --generate-notes \
              --title "greywatch ${{ github.ref_name }}"
          fi

