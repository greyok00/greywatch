# Gate on every push and PR: lint + the full battery headless.
# System python (ubuntu-latest = 3.12, matches requires-python >=3.12) with
# a system-site-packages venv — setup-python's interpreter cannot see the
# apt-installed PyGObject, and the GUI test modules need `gi` to even collect.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout v5.1.0

      - name: GTK stack plus host tools the battery asserts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 yara

      - name: venv with system PyGObject visible
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --disable-pip-version-check \
            -r requirements-dev.txt

      - name: Lint (ruff; config in pyproject.toml)
        run: .venv/bin/ruff check .

      - name: Test battery (headless; display-dependent modules skip)
        run: .venv/bin/python -m pytest tests/ -q

  package:
    # Build the wheel, install it into a clean venv, and smoke the entry
    # point the same way a user would run it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout v5.1.0

      - name: Toolchain
        run: python3 -m pip install --disable-pip-version-check build

      - name: Build the wheel (python -m build --wheel via packaging/build-wheel.sh)
        run: ./packaging/build-wheel.sh dist

      - name: Clean venv install from the wheel
        run: |
          python3 -m venv clean-venv
          WHEEL=$(ls dist/greywatch-*.whl | head -1)
          clean-venv/bin/pip install --disable-pip-version-check "$WHEEL"

      - name: Console script smoke tests
        run: |
          clean-venv/bin/gw --help
          clean-venv/bin/gw --version
          clean-venv/bin/gw status --help