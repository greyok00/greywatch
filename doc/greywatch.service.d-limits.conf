# greywatch limits drop-in — 2026-10-25 lockup remediation.
# Install to /etc/systemd/system/greywatch.service.d/limits.conf
#
# WHY: the previous CPUQuota=10% / MemoryMax=200M let the daemon hit its
# memory ceiling (200M current, 200M peak, swap active) and stall its main
# loop while a connection storm queued events. Enforcement then black-holed
# new TCP until the appfw was switched off. These limits give the loop
# enough headroom to drain the queue and write status on time; the fixed
# worker/engine and the main-loop liveness watchdog are the actual
# fail-open guards, not the cgroup limits.
[Service]
CPUQuota=50%
MemoryMax=768M
Nice=5
IOSchedulingClass=best-effort
