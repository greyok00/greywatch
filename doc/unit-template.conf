
[Unit]
Description=greywatch — one root-privileged security monitor daemon
Documentation=file:__GW_HOME__/README.md
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
ExecStart=/usr/bin/python3 __GW_HOME__/greywatch_daemon.py
Restart=on-failure
RestartSec=5

ProtectSystem=strict
ReadWritePaths=__GW_HOME__
PrivateTmp=true
CPUQuota=10%
MemoryMax=200M
Nice=10
IOSchedulingClass=idle

