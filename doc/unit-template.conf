# unit-template.conf — greywatch systemd hardening template
# Built 2026-10-22 (plan item 0.6, doc of the greywatch build plan).
#
# Source of truth: every directive below is verified against the LOCAL
# systemd 257 (257.13-1~deb13u1) man pages on this machine —
#   systemd.exec            → ProtectSystem, ReadWritePaths, PrivateTmp,
#                             IOSchedulingClass, Nice
#   systemd.resource-control → CPUQuota, MemoryMax
#   systemd.service         → Restart
# The historic overseer unit was deleted in Phase 1 cleanup; its recorded
# excerpts cover: ProtectSystem, PrivateTmp, CPUQuota-style caps, Restart.
# Directives that could not be verified were DROPPED, not guessed
# (plan line 68 rule). Values come from plan line 108 / "Caps" section.
#
# Cross-check table (G1.5 / G2.7): each row = directive → verification source.
#   ProtectSystem=strict     → systemd.exec(5); overseer excerpt (recorded)  → KEEP
#   ReadWritePaths=<dir>     → systemd.exec(5); plan line 108                → KEEP
#   PrivateTmp=true          → systemd.exec(5); overseer excerpt (recorded)  → KEEP
#   CPUQuota=10%             → systemd.resource-control(5); plan "Caps"      → KEEP
#   MemoryMax=200M           → systemd.resource-control(5); plan "Caps"      → KEEP
#   Restart=on-failure/5     → systemd.service(5) RestartSec=5; plan L1      → KEEP
#   Nice=10                  → systemd.exec(5); plan line 108                → KEEP
#   IOSchedulingClass=idle   → systemd.exec(5); plan line 108                → KEEP
#   ProtectHome=read-only → present in systemd.exec(5) but NOT in the recorded
#     overseer excerpts or plan line 108 → DROPPED (unverifiable for this unit's
#     runtime, which tails files under /home).
#   NoNewPrivileges → present in systemd.exec(5); NOT recorded for overseer
#     AND conflicts with the pkexec-helper pattern planned for L1 → DROPPED.
#   DynamicUser / User= → root service is an owner-ordered requirement
#     (plan "Why the daemon must run as root") → not applicable.

[Unit]
Description=greywatch — one root-privileged security monitor daemon
Documentation=file:__GW_HOME__/README.md
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
ExecStart=/usr/bin/python3 __GW_HOME__/greywatch_daemon.py
Restart=on-failure
RestartSec=5

# hardening (values per plan line 108 + Global Constraints)
ProtectSystem=strict
ReadWritePaths=__GW_HOME__
PrivateTmp=true
CPUQuota=10%
MemoryMax=200M
Nice=10
IOSchedulingClass=idle

# L1 rule: the daemon never imports GTK and never executes GUI/CLI strings
# (enforced in code, recorded here as the review contract for G2.9).