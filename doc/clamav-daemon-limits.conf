# RETIRED 2026-11-14 (owner decision, D1-a): the real clamd service is
# the antivirus engine and greywatch carries every scan through its
# socket. The engine runs at distro defaults (its own clamd.conf sets
# MaxScanSize / MaxFileSize); installing caps that throttled it was the
# wrong trade and this drop-in is no longer shipped or installed. Kept
# here as the record: if a future owner ever wants a bounded engine
# again, these were the values - CPUQuota=25%, MemoryMax=1536M, Nice=10,
# IOSchedulingClass=idle - placed in
# /etc/systemd/system/clamav-daemon.service.d/limits.conf.
